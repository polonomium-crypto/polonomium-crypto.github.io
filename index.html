<!DOCTYPE html>

<html style="background-color: white;">
    <head>
        <link rel="stylesheet" href="/CSS/index-styles.css">
        <link rel="stylesheet" href="/CSS/styles.css">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
    </head>

    <body>
        <div class="wrapper">
            <div class="container">
                <!-- Side nav -->
                <div class="side">
                    <div class="index">
                        <nav class="nav-index">
                            <div class="tickBox"></div>
                            <a class="indexText" href="/HTML/about-me.html"><strong>About me</strong></a>
                        </nav>
                        <div class="nav-index">
                            <div class="tickBox"></div>
                            <a class="indexText" href="/HTML/work.html"><strong>Work</strong></a>
                        </div>
                        <div class="nav-index">
                            <div class="tickBox"></div>
                            <a class="indexText" id="contactButtonMenu"><strong>Contacts</strong></a>
                        </div>
                    </div>

                    <div class="title">
                        <div class="titleStarsContainer">
                            <div class="stars point9" style="width: 90px; aspect-ratio: 1; left:40px; bottom: 10px;"></div>
                            <div class="stars point7" style="width: 40px; left: 10px; bottom: 5px; background-color: #ff3737;"></div>
                            <div class="stars point8" style="width: 60px; left: 95px; bottom: 0; background-color: #FF8D28;"></div>
                        </div>
                        <h1 class="titleText">TJ's WEB</h1>
                        <p class="subTitle">Welcome to my portfolio!<br>Hope you enjoy it!</p>
                    </div>
                </div>

                <!-- Main -->
                <div class="container2" id="container2">
                    <!-- Title -->
                    <div class="portfolioTitle">
                        Portfolio
                        <div class="spinningTitleStar"></div> 
                    </div>

                    <!-- Stars -->
                    <div class="mag-zone" data-mode="true" data-wiggle="false" style="left: 140px; top: 60px;">
                        <button class="mag-btn summer" style="rotate: 30deg; width: 40%;">
                        </button>
                    </div>
                    <div class="mag-zone" data-mode="true" data-wiggle="false" style="left: -30px; top: 180px;">
                        <button class="mag-btn summer" style="rotate: -20deg; width: 25%;">
                        </button>
                    </div>
                    <div class="mag-zone" data-mode="true" data-wiggle="false" style="left: 20px;">
                        <button class="mag-btn summer" id="btnPlain">
                        </button>
                    </div>

                    <!--Strip aniamtion-->
                    <div class="stripe1" style="background: #ff3737;"></div>
                    <div class="stripe1" style="background: #FF8D28; bottom: -115px;"></div>
                    <div class="stripe1" style="background: #FFCC00; bottom: -204px;"></div>
                </div>
            </div>

            <!-- Contacts -->
            <div class="contactsWrapper" id="contactLetter">
                <div class="contact-bg"></div>
                <div class="contactPaper">
                    <h2 class="contactTitle">Text me!</h2>
                    <p class="contactParagraph">
                        The best way to contact me is through Discord
                        or if you prefer, contact me through by email!
                    </p>
                    <button class="contactButton" id="discordButton" onclick="discordButton()">Copy my Discord</button>
                    <button class="contactButton" id="emailButton" onclick="emailButton()">Copy my email</button>
                </div>
            </div>

                </div>

            </footer> -->

            <!-- Packages -->
            <script src="https://cdn.jsdelivr.net/npm/gsap@3.15/dist/gsap.min.js"></script>

            <!-- Scripts -->
            <script src="/JAVASCRIPT/animation.js"></script>
        </div>

</html>
